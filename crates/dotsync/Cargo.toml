[package]
name = "dotsync"
description = "Sync user-level config files and folders between machines through a cloud folder, using symlinks."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[[bin]]
name = "dotsync"
path = "src/main.rs"

[dependencies]
dotsync-core = { path = "../dotsync-core" }
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
dialoguer = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"          # reset SIGPIPE to default so `dotsync … | head` exits quietly

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
dotsync-core = { path = "../dotsync-core" }
serde_json = "1"
