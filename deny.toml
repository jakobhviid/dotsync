# cargo-deny — the supply-chain gate CI runs before a release
# (`.github/workflows/release.yml`). We check licenses, banned crates, and
# sources, but deliberately NOT the advisory database: releases cut on every push,
# and a newly-published CVE must never block an unrelated release. Advisories are
# reviewed out of band. (Pattern lifted from the `tern` sibling; see the house
# rust-cli-guidelines.)

[licenses]
# Permissive licenses only — every dependency must resolve to one of these.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# dotsync does no networking. Ban TLS/crypto stacks outright so one can never be
# pulled in transitively and drag OpenSSL into a tool that syncs secrets.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
# crates.io only — no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
