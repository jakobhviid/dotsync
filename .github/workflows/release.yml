name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Clippy is the house green gate: warnings are errors, and a red gate
      # publishes nothing. `cargo test` alone is not enough.
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Supply-chain gate: permissive-only licenses, banned TLS stacks, crates.io
      # only. Advisories are intentionally NOT checked here (see deny.toml) so a
      # fresh CVE can't block an unrelated release.
      - name: cargo-deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  build:
    needs: [test, deny]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `dotsync --version` matches the release)
        run: |
          # Version = Conventional-Commit semver from history (never bump by hand):
          #   feat: -> minor | fix:/other -> patch | type!: breaking -> major (baseline 1.0.0)
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "stamped $v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/dotsync-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" dotsync
      - name: Emit Homebrew bottle tag (macOS)
        if: runner.os == 'macOS'
        run: |
          # macos-latest is Apple Silicon, so the host tag is like "arm64_sequoia".
          # Its codename drives both the arm64 and the (cross-built) Intel bottle
          # tag. brew's developer-mode notice goes to stderr; the tag is on stdout.
          host=$(brew ruby -e 'puts Utils::Bottles.tag.to_s' 2>/dev/null)
          codename=${host#arm64_}
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) tag="arm64_${codename}" ;;
            x86_64-apple-darwin)  tag="${codename}" ;;
          esac
          printf '%s' "$tag" > "dist/${{ matrix.target }}.bottletag"
          echo "bottle tag: $tag"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same Conventional-Commit semver as the stamp step (kept in sync).
          VERSION=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Repackage the prebuilt binary as Homebrew bottles so `brew install`
          # POURS them (no build-from-source, no C compiler / Xcode gate). A poured
          # bottle skips the formula's `install`, so each keg must already hold what
          # install produces: binary + man page + completions. man/completions are
          # generated CLI text (identical on every platform), so render them once
          # from the Linux binary and reuse them in the macOS kegs too.
          tmp=$(mktemp -d)
          tar xzf art/dotsync-x86_64-unknown-linux-musl.tar.gz -C "$tmp"
          "$tmp/dotsync" man              > "$tmp/dotsync.1"
          "$tmp/dotsync" completions zsh  > "$tmp/_dotsync"
          "$tmp/dotsync" completions bash > "$tmp/dotsync.bash"
          "$tmp/dotsync" completions fish > "$tmp/dotsync.fish"

          # make_bottle <binary-tarball-in-art> <homebrew-tag> -> prints sha256
          make_bottle() {
            keg="dotsync/${VERSION}"
            root="stage-$2"
            rm -rf "$root"
            mkdir -p "$root/$keg/bin" \
                     "$root/$keg/share/man/man1" \
                     "$root/$keg/share/zsh/site-functions" \
                     "$root/$keg/share/bash-completion/completions" \
                     "$root/$keg/share/fish/vendor_completions.d"
            tar xzf "art/$1" -C "$root/$keg/bin"
            cp "$tmp/dotsync.1"    "$root/$keg/share/man/man1/dotsync.1"
            cp "$tmp/_dotsync"     "$root/$keg/share/zsh/site-functions/_dotsync"
            cp "$tmp/dotsync.bash" "$root/$keg/share/bash-completion/completions/dotsync"
            cp "$tmp/dotsync.fish" "$root/$keg/share/fish/vendor_completions.d/dotsync.fish"
            ( cd "$root" && tar czf "../art/dotsync-${VERSION}.$2.bottle.tar.gz" dotsync )
            sha256sum "art/dotsync-${VERSION}.$2.bottle.tar.gz" | awk '{print $1}'
          }

          ARM_TAG=$(cat art/aarch64-apple-darwin.bottletag)
          X86_TAG=$(cat art/x86_64-apple-darwin.bottletag)
          {
            echo "BOTTLE_SHA=$(make_bottle dotsync-x86_64-unknown-linux-musl.tar.gz x86_64_linux)"
            echo "MAC_ARM_BOTTLE_SHA=$(make_bottle dotsync-aarch64-apple-darwin.tar.gz "$ARM_TAG")"
            echo "MAC_X86_BOTTLE_SHA=$(make_bottle dotsync-x86_64-apple-darwin.tar.gz "$X86_TAG")"
            echo "MAC_CODENAME=${ARM_TAG#arm64_}"
          } >> "$GITHUB_ENV"

          gh release create "v$VERSION" art/*.tar.gz \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set — built & released, but skipping the tap update."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          sha() { sha256sum "art/dotsync-$1.tar.gz" | awk '{print $1}'; }
          sed -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@MAC_CODENAME@/${MAC_CODENAME}/g" \
            -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" \
            -e "s/@MAC_ARM_BOTTLE_SHA@/${MAC_ARM_BOTTLE_SHA}/g" \
            -e "s/@MAC_X86_BOTTLE_SHA@/${MAC_X86_BOTTLE_SHA}/g" \
            -e "s/@X86_SHA@/$(sha x86_64-unknown-linux-musl)/g" \
            -e "s/@ARM_SHA@/$(sha aarch64-unknown-linux-musl)/g" \
            -e "s/@MAC_X86_SHA@/$(sha x86_64-apple-darwin)/g" \
            -e "s/@MAC_ARM_SHA@/$(sha aarch64-apple-darwin)/g" \
            ci/dotsync.rb.tmpl > /tmp/dotsync.rb
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp /tmp/dotsync.rb tap/Formula/dotsync.rb
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add Formula/dotsync.rb
          git commit -m "dotsync ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
